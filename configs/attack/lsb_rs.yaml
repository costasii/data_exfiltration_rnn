include:
  - ../dataset/bgl.yaml
  - ../model/deeplog.yaml
  - ../train/bgl_train.yaml
  - ../seeds/seeds.yaml

experiment:
  name: lsb_rs
  mode: white_box      
  setting: centralized
  target_id: split0

checkpoint:
  base_dir: models/trained/deeplog_bgl
  filename: deeplog_bestloss.pth

attack:
  name: lsb_encode
  preprocessing:
    huffman: true
    
  params:
    approach: rs
    n_bits: 1
    rs:
      k_bytes: 16         # message bytes per block
      nsym: 32             # parity bytes per block (can correct up to nsym/2 byte errors)
      interleave_cols: 32 # 0 or omit to disable interleaving
      keep_raw_on_fail: true


dataset:
  name: bgl
  base_dir: data/processed/bgl
  train_sequences_file: bgl_train