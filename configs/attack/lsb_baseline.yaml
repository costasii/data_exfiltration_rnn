include:
  - ../dataset/bgl.yaml
  - ../model/deeplog.yaml
  - ../train/bgl_train.yaml
  - ../seeds/seeds.yaml

experiment:
  name: lsb_baseline
  mode: white_box      
  setting: centralized
  target_id: split0  # default; sweep overrides this via --target-id


# base checkpoint dir (no split here)
checkpoint:
  base_dir: models/trained/deeplog_bgl
  filename: deeplog_bestloss.pth

attack:
  name: lsb_encode
  preprocessing:
    huffman: true
  params:
    approach: baseline
    n_bits: 1

# base dataset dir (no split here)
dataset:
  name: bgl
  base_dir: data/processed/bgl
  train_sequences_file: bgl_train