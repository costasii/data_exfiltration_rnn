  model_filename: "deeplog_bestloss.pth"
  sequentials: true
  quantitatives: false
  semantics: false


include:
  - ../train/bgl_train.yaml
  - ../dataset/bgl.yaml
  - ../model/deeplog.yaml
  - ../seeds/seeds.yaml