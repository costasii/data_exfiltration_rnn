include:
  - ../dataset/bgl.yaml
  - ../model/deeplog.yaml
  - ../train/bgl_train.yaml
  - ../seeds/seeds.yaml

experiment:
  name: lsb_defense
  mode: white_box
  setting: centralized
  target_id: split0   # default; sweep overrides via --target-id

# describes the attacked checkpoint location pattern
attacked_checkpoint:
  base_dir: models/attacked/white_box/bgl
  # must match your existing folder naming exactly
  run_dir_template: "bgl__atk=lsb(n{attack_bits},{approach},compressed={compressed})"
  filename: ckpt_attacked.pth

# the “case” chooses which attacked model to defend (6 total)
selection:
  case: baseline_c0   # default; sweep overrides via --case
  cases:
    baseline_c0:   { approach: baseline,   huffman: false, attack_bits: 25  }
    baseline_c1:   { approach: baseline,   huffman: true,  attack_bits: 24  }
    repetition_c0: { approach: repetition, huffman: false, attack_bits: 25}
    repetition_c1: { approach: repetition, huffman: true,  attack_bits: 27 }
    rs_c0:         { approach: rs,         huffman: false, attack_bits: 24 }
    rs_c1:         { approach: rs,         huffman: true,  attack_bits: 24 }

defense:
  name: lsb_random_overwrite
  params:
    enabled: true
    n_bits_defended: 6   # default; sweep overrides via --defend-bits
 

    # if you need these to reconstruct decoding / similarity exactly:
    repetition:
      reps: 3

    rs:
      k_bytes: 16
      nsym: 32
      interleave_cols: 32
      drop_failed_blocks: true

    hamming:
      interleave_cols: 32

dataset:
  name: bgl
  base_dir: data/processed/bgl
  train_sequences_file: bgl_train